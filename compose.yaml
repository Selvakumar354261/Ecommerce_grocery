name: ${COMPOSE_PROJECT_NAME:-grocery_commerce}
x-api: &api
  build: ./backend
  environment: &env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grocery}:${POSTGRES_PASSWORD:-local-only-change-this-password}@db:5432/${POSTGRES_DB:-grocery}
    SEED_DEMO: ${SEED_DEMO:-true}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoGrocery!2026}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    RESERVATION_MINUTES: ${RESERVATION_MINUTES:-30}
    OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-development}
    OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
    OTP_WEBHOOK_TOKEN: ${OTP_WEBHOOK_TOKEN:-}
    OTP_SECRET: ${OTP_SECRET:-change-this-otp-secret-in-production}
  init: true
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-this-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    command: [sh, -c, "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  backend:
    <<: *api
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *api
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${APP_PORT:-8080}:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
  tests:
    <<: *api
    profiles: [test]
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grocery}:${POSTGRES_PASSWORD:-local-only-change-this-password}@db:5432/grocery_test
      PYTHONPATH: /app
    command: [sh, -c, "python tests/prepare.py && alembic upgrade head && pytest -q"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
