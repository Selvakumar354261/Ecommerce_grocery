# Apply with: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  backend:
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload]
    volumes: ['./backend:/app']
  frontend:
    build:
      context: ./frontend
      target: development
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, '80']
    volumes:
      - ./frontend/src:/web/src
      - ./frontend/index.html:/web/index.html
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1/').then(r=>process.exit(r.ok?0:1))"]

